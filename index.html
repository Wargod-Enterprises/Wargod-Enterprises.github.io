<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wargod Enterprises</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    padding: 16px;
    box-sizing: border-box;
  }
  h1 { margin: 0 0 24px; font-size: 2.5rem; text-align: center; }
  h2 { margin: 0 0 8px; font-size: 2.5rem; text-align: center; }
  p { margin: 0 0 32px; color: #aaa; }
  .games {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
  }
  .games a {
    display: block;
    padding: 16px;
    border: 2px solid #eee;
    border-radius: 8px;
    color: #eee;
    text-decoration: none;
    text-align: center;
    font-size: 1.2rem;
  }
  .games a:hover { background: #eee; color: #111; }
  .quit {
    margin-top: 32px;
    padding: 10px 32px;
    background: none;
    border: 1px solid #555;
    border-radius: 8px;
    color: #aaa;
    font: inherit;
    font-size: 1rem;
    cursor: pointer;
  }
  .quit:hover { border-color: #eee; color: #eee; }
  .notes { margin-top: 24px; color: #aaa; font-size: 0.9rem; text-align: center; line-height: 1.6; }
  .company { margin-top: 16px; color: #888; font-size: 0.85rem; letter-spacing: 0.05em; }
  /* "Thanks for playing" screen shown when quitting */
  #thanks {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #111;
    text-align: center;
    padding: 16px;
  }
  #thanks.show { display: flex; }
  #thanks h1 { margin: 0; }
  #thanks p { margin: 0; }
  #closeNote { visibility: hidden; }
</style>
</head>
<body>
  <h2>Wargod Studios</h2>
  <p>Pick a game</p>
  <div class="games">
    <!-- To add a game, copy one line below and change the link and name. -->
    <a href="https://wargod-enterprises.github.io/Hacker-Game/">Operator*</a>
    <a href="https://wargod-enterprises.github.io/RPG/">RPG**</a>
    <a href="https://wargod-enterprises.github.io/Action-Game/">Action Game (working title)*</a>
    <a href="https://wargod-enterprises.github.io/Agent-Game/">Agent Game (working title)*</a>
  </div>
  <button class="quit" id="quit">Quit</button>
  <div class="notes">
    <div>* in progress</div>
    <div>** level 1 complete</div>
  </div>
  <div class="company">Wargod Enterprises</div>

  <div id="thanks" role="dialog" aria-live="polite">
    <h1>Thanks for playing</h1>
    <p>Wargod Studios</p>
    <p id="closeNote">You can close this tab now.</p>
  </div>

  <script>
    // Quit: show "Thanks for playing", then try to close the tab. Browsers only let
    // a page close itself in some cases (e.g. an installed app), so if the tab is
    // still open a moment later, tell the player they can close it.
    document.getElementById('quit').addEventListener('click', () => {
      document.getElementById('thanks').classList.add('show');
      setTimeout(() => {
        window.close();
        setTimeout(() => { document.getElementById('closeNote').style.visibility = 'visible'; }, 300);
      }, 1500);
    });
  </script>
</body>
</html>
