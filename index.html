<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wargod Enterprises</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    padding: 16px;
    box-sizing: border-box;
  }
  h1 { margin: 0 0 24px; font-size: 2.5rem; text-align: center; }
  h2 { margin: 0 0 4px; font-size: 1.4rem; }
  p { margin: 0 0 32px; color: #aaa; }
  .games {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
  }
  .games a {
    display: block;
    padding: 16px;
    border: 2px solid #eee;
    border-radius: 8px;
    color: #eee;
    text-decoration: none;
    text-align: center;
    font-size: 1.2rem;
  }
  .games a:hover { background: #eee; color: #111; }
</style>
</head>
<body>
  <h1>Wargod Enterprises</h1>
  <h2>Wargod Studios</h2>
  <p>Pick a game</p>
  <div class="games">
    <!-- To add a game, copy one line below and change the link and name. -->
    <a href="https://wargod-enterprises.github.io/Hacker-Game/">Operator</a>
    <a href="https://wargod-enterprises.github.io/RPG/">Click Game</a>
    <a href="https://wargod-enterprises.github.io/Action-Game/">Action Game</a>
    <a href="https://wargod-enterprises.github.io/Agent-Game/">Agent Game</a>
  </div>
</body>
</html>
